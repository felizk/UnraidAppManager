# For `alembic revision --autogenerate -m "..."` during development.
# The app itself runs migrations through uam.db.init() and does not read this file.
[alembic]
script_location = uam/db/migrations
sqlalchemy.url = sqlite:///./dev.sqlite3

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[handler_console]
class = StreamHandler
args = (sys.stderr,)
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
