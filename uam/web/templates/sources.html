{% extends "base.html" %}
{% block title %}Sources - UAM{% endblock %}
{% block content %}
<h1>Sources</h1>

<article>
  <h2>Add a source</h2>
  <form hx-post="/sources">
    <label>Repository
      <input type="text" name="repo" placeholder="owner/repo or https://github.com/owner/repo" required>
    </label>
    <div class="grid">
      <label>Branch
        <input type="text" name="ref" placeholder="main">
      </label>
      <label>Template path (optional)
        <input type="text" name="template_path" placeholder="unraid/app.xml">
      </label>
      <label>Credential
        <select name="credential_id">
          <option value="">(public repository)</option>
          {% for c in credentials %}<option value="{{ c.id }}">{{ c.name }}</option>{% endfor %}
        </select>
      </label>
    </div>
    <button type="submit" hx-disabled-elt="this">Add source</button>
  </form>
</article>

{% if sources %}
<table>
  <thead><tr><th>Repository</th><th>Branch</th><th>Path</th><th>Credential</th><th></th></tr></thead>
  <tbody>
  {% for s in sources %}
  {% include "_source_row.html" %}
  <tr class="templates-row"><td colspan="5"><div id="templates-{{ s.id }}"></div></td></tr>
  {% endfor %}
  </tbody>
</table>
{% else %}
<p>No sources yet.</p>
{% endif %}
{% endblock %}
