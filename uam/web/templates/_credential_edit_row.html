<tr id="cred-{{ c.id }}" class="editing">
  <td>{{ c.name }}</td><td>{{ c.kind.value }}</td>
  <td><input type="text" name="username" value="{{ c.username }}" aria-label="Username / e-mail" placeholder="username / e-mail"></td>
  <td><input type="password" name="secret" autocomplete="new-password" aria-label="New secret"
             placeholder="blank keeps current"></td>
  <td>{{ c.registry_host }}</td>
  <td class="row-actions">
    <button class="sm" hx-post="/credentials/{{ c.id }}/update" hx-include="#cred-{{ c.id }}"
            hx-target="#cred-{{ c.id }}" hx-swap="outerHTML">Save</button>
    <button class="sm secondary outline" hx-get="/credentials/{{ c.id }}/row" hx-target="#cred-{{ c.id }}" hx-swap="outerHTML">Cancel</button>
  </td>
</tr>
