{% if events %}
<ul class="timeline">
  {% for e in events %}
  <li class="ev-{{ e.level }}"><time>{{ e.ts|stamp }}</time> <strong>{{ e.kind }}</strong> {% if "\n" in e.message %}<pre class="logs">{{ e.message }}</pre>{% else %}{{ e.message }}{% endif %}</li>
  {% endfor %}
</ul>
{% else %}<p>No events yet.</p>{% endif %}
