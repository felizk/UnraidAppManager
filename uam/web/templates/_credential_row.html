<tr id="cred-{{ c.id }}">
  <td>{{ c.name }}</td><td>{{ c.kind.value }}</td><td>{{ c.username }}</td><td aria-label="hidden">••••••</td><td>{{ c.registry_host }}</td>
  <td class="row-actions">
    <button class="sm outline" hx-get="/credentials/{{ c.id }}/edit" hx-target="#cred-{{ c.id }}" hx-swap="outerHTML">Edit</button>
    <button class="sm outline" hx-post="/credentials/{{ c.id }}/test" hx-target="#test-{{ c.id }}" hx-swap="innerHTML">Test</button>
    <button class="sm secondary outline" hx-delete="/credentials/{{ c.id }}" hx-target="#cred-{{ c.id }}" hx-swap="delete"
            hx-confirm="Delete credential {{ c.name }}?">Delete</button>
    <span id="test-{{ c.id }}">{% if note %}<span class="test-result ok" role="status">{{ note }}</span>{% endif %}</span>
  </td>
</tr>
