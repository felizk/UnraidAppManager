[project]
name = "unraid-app-manager"
version = "0.1.0"
description = "Install and update Unraid apps straight from GitHub repositories"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "pydantic>=2.7",
    "sqlalchemy[asyncio]>=2.0.30",
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "httpx>=0.27",
    "docker>=7.1",
    "apscheduler>=3.10,<4",
    "cryptography>=42",
    "argon2-cffi>=23.1",
    "defusedxml>=0.7.1",
]

[project.scripts]
uam-lint = "uam.lint.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "time-machine>=2.14",
    "types-docker",
    "types-defusedxml",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["uam"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
# DockerEngine.stop(timeout=…) is Docker's stop grace period, not an asyncio timeout.
ignore = ["ASYNC109"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108"]
"uam/db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["uam", "tests"]
plugins = []

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["apscheduler.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "docker: needs a real Docker daemon (deselected by default)",
    "integration: full-stack tests with real services (deselected by default)",
    "e2e: browser tests (deselected by default)",
]
addopts = "-m 'not docker and not integration and not e2e'"
