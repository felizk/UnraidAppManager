name: UAM template lint
description: >-
  Lint an Unraid App Manager app repository (templates, ports, update safety).
  When using `base`, check out with enough history (fetch-depth: 0) so the ref exists.
inputs:
  path:
    description: Repository path to lint
    default: "."
  base:
    description: Git ref to compare against (for example origin/main); empty skips the breaking-change rules
    default: ""
  strict:
    description: Fail on warnings as well as errors
    default: "false"
runs:
  using: composite
  steps:
    - uses: astral-sh/setup-uv@v5
    - shell: bash
      env:
        UAM_LINT_PATH: ${{ inputs.path }}
        UAM_LINT_BASE: ${{ inputs.base }}
        UAM_LINT_STRICT: ${{ inputs.strict }}
      run: |
        args=("${UAM_LINT_PATH:-.}" --format github)
        if [ -n "$UAM_LINT_BASE" ]; then args+=(--base "$UAM_LINT_BASE"); fi
        if [ "$UAM_LINT_STRICT" = "true" ]; then args+=(--strict); fi
        uvx --from "${{ github.action_path }}/../.." uam-lint "${args[@]}"
