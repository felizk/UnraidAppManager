name: integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Pre-pull service images
        run: |
          docker pull registry:2
          docker pull jc21/nginx-proxy-manager:2.12.3
          docker pull alpine:3.20
      - name: Integration tests (real Docker, NPM and registry)
        env:
          UAM_TEST_REQUIRE_NPM: "1"
        run: uv run pytest -m integration tests/integration -v -rs
