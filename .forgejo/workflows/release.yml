name: release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: https://github.com/actions/checkout@v4

      # The registry is the Forgejo instance itself: strip the scheme from the
      # server URL. Image names must be lowercase.
      - id: registry
        run: |
          host="${GITHUB_SERVER_URL#*://}"
          echo "host=$host" >> "$GITHUB_OUTPUT"
          echo "image=$host/${GITHUB_REPOSITORY_OWNER,,}/unraid-app-manager" >> "$GITHUB_OUTPUT"
        shell: bash

      - uses: https://github.com/docker/setup-qemu-action@v3
      - uses: https://github.com/docker/setup-buildx-action@v3
      - uses: https://github.com/docker/login-action@v3
        with:
          registry: ${{ steps.registry.outputs.host }}
          username: ${{ github.repository_owner }}
          password: ${{ secrets.REGISTRY_TOKEN }}
      - id: meta
        uses: https://github.com/docker/metadata-action@v5
        with:
          images: ${{ steps.registry.outputs.image }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=sha-
            type=semver,pattern=v{{version}}
            type=semver,pattern={{version}}
      - uses: https://github.com/docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ steps.registry.outputs.image }}:latest
          cache-to: type=inline
