name: integration

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: https://github.com/actions/checkout@v4
      - uses: https://github.com/astral-sh/setup-uv@v5
      - run: uv sync --locked
      - name: Pre-pull service images
        run: |
          docker pull registry:2
          docker pull jc21/nginx-proxy-manager:2.12.3
          docker pull alpine:3.20
      # The job runs in a container beside the host's Docker daemon, so the ports the tests publish
      # are on the host, reached through the job container's default gateway (not 127.0.0.1).
      - name: Find the Docker host address
        run: |
          gw=""
          if [ ! -f /.dockerenv ]; then
            echo "Not in a container: the daemon's ports are on loopback"
          else
            gw=$(uv run python -c 'import socket, struct; print(next((socket.inet_ntoa(struct.pack("<L", int(f[2], 16))) for f in (line.split() for line in open("/proc/net/route").readlines()[1:]) if f[1] == "00000000"), ""))' || true)
            if [ -z "$gw" ]; then
              gw=$(docker network inspect bridge -f '{{(index .IPAM.Config 0).Gateway}}' || true)
            fi
          fi
          echo "Docker host: ${gw:-127.0.0.1}"
          echo "UAM_TEST_DOCKER_HOST_IP=${gw:-127.0.0.1}" >> "$GITHUB_ENV"
      - name: Integration tests (real Docker, NPM and registry)
        env:
          UAM_TEST_REQUIRE_NPM: "1"
        run: uv run pytest -m integration tests/integration -v -rs
